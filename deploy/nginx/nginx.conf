worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Keep standard API uploads small. Photogrammetry uploads have a scoped higher limit below.
    client_max_body_size 6M;

    upstream sightseeing_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        # The app optimizes each capture to <=640 KiB (<=20 MiB for 32 photos).
        # Allow multipart framing and metadata without increasing limits for other endpoints.
        location ~ ^/api/v1/admin/(ar-models/3d-model|ar-cards/[0-9a-fA-F-]+/3d-model)$ {
            client_max_body_size 24M;
            proxy_pass         http://sightseeing_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass         http://sightseeing_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
