version: "3.9"

services:
  db-init:
    image: postgres:18-alpine
    container_name: dauviendu-db-init
    network_mode: host
    restart: "no"
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-awkdvd}
      PGUSER: ${POSTGRES_USER:-awkdvd}
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./backend/src/SightseeingTravel.Api/Migrations/0001_InitialModularMonolithSchema.sql:/schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do sleep 2; done;
        psql -v ON_ERROR_STOP=1 -f /schema.sql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dauviendu-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://127.0.0.1:8080"
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=${POSTGRES_DB:-awkdvd};Username=${POSTGRES_USER:-awkdvd};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Database__ApplyMigrationsAndSeedOnStartup: "true"
      Routing__BaseUrl: "${ROUTING_BASE_URL:-http://127.0.0.1:5000/}"
      Routing__WalkingBaseUrl: "${ROUTING_WALKING_BASE_URL:-http://127.0.0.1:5001/}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      Jwt__Issuer: "${JWT_ISSUER:-SightseeingTravel.Api}"
      Jwt__Audience: "${JWT_AUDIENCE:-SightseeingTravel.Clients}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      Email__SmtpHost: "${SMTP_HOST:-}"
      Email__SmtpPort: "${SMTP_PORT:-587}"
      Email__SmtpUsername: "${SMTP_USERNAME:-}"
      Email__SmtpPassword: "${SMTP_PASSWORD:-}"
      Email__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Email__FromName: "${SMTP_FROM_NAME:-Dấu Viễn Du}"
      Email__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      ContaboStorage__ServiceUrl: "${CONTABO_S3_SERVICE_URL:-https://sin1.contabostorage.com}"
      ContaboStorage__AuthenticationRegion: "${CONTABO_S3_AUTH_REGION:-default}"
      ContaboStorage__BucketName: "${CONTABO_S3_BUCKET_NAME:-awakencloud}"
      ContaboStorage__PublicBaseUrl: "${CONTABO_S3_PUBLIC_BASE_URL:-https://sin1.contabostorage.com/3e270ee749cc4c6caa56fcceac2c4202:awakencloud}"
      ContaboStorage__KeyPrefix: "${CONTABO_S3_KEY_PREFIX:-dauviendu_cloud}"
      ContaboStorage__AccessKey: "${CONTABO_S3_ACCESS_KEY:-CONTABO_S3_ACCESS_KEY}"
      ContaboStorage__SecretKey: "${CONTABO_S3_SECRET_KEY:-CONTABO_S3_SECRET_KEY}"
      ContaboStorage__ForcePathStyle: "true"

  routing:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    container_name: dauviendu-routing
    restart: unless-stopped
    network_mode: host
    environment:
      DISABLE_ACCESS_LOGGING: "true"
    volumes:
      - /opt/dauviendu-routing:/data:ro
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --threads
      - "2"
      - --ip
      - 127.0.0.1
      - --port
      - "5000"
      - --mmap=on
      - /data/vietnam-latest.osrm

  routing-foot:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    container_name: dauviendu-routing-foot
    restart: unless-stopped
    network_mode: host
    environment:
      DISABLE_ACCESS_LOGGING: "true"
    volumes:
      - /opt/dauviendu-routing:/data:ro
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --threads
      - "2"
      - --ip
      - 127.0.0.1
      - --port
      - "5001"
      - --mmap=on
      - /data/foot/vietnam-latest.osrm
