<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Sightseeing Travel - Heritage Seal Logo</title>

  <!-- Seal: outer ring + inner hairline ring -->
  <circle id="Seal" cx="256" cy="256" r="244" fill="#1B120C"/>
  <circle id="Ring-Outer" cx="256" cy="256" r="240" stroke="#C9973A" stroke-width="8"/>
  <circle id="Ring-Inner" cx="256" cy="256" r="222" stroke="#C9973A" stroke-width="2"/>

  <!-- Cardinal points N / E / S / W on the ring band -->
  <path id="Cardinal-N" d="M256 24 L262 34 L256 44 L250 34 Z" fill="#F0CF86"/>
  <path id="Cardinal-S" d="M256 468 L262 478 L256 488 L250 478 Z" fill="#F0CF86"/>
  <path id="Cardinal-E" d="M468 256 L478 250 L488 256 L478 262 Z" fill="#F0CF86"/>
  <path id="Cardinal-W" d="M24 256 L34 250 L44 256 L34 262 Z" fill="#F0CF86"/>

  <!-- Heritage shield: 210 x 340 (ratio 1 : 1.618) -->
  <path id="Shield-Border" d="M151 96 H361 V250 C361 336 310 392 256 432 C202 392 151 336 151 250 Z" fill="#C9973A"/>
  <path id="Shield-Face" d="M161 106 H351 V250 C351 328 305 378 256 414 C207 378 161 328 161 250 Z" fill="#1B120C"/>

  <!-- North star (travel / compass) -->
  <g id="North-Star" transform="translate(256 152)">
    <path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" transform="rotate(45)" fill="#C9973A"/>
    <path d="M0 -26 L5 -5 L26 0 L5 5 L0 26 L-5 5 L-26 0 L-5 -5 Z" fill="#F0CF86"/>
  </g>

  <!-- Monogram S (two tangent arcs) -->
  <path id="Letter-S" d="M238.05 229 A22 22 0 1 0 219 262 A22 22 0 1 1 199.95 295"
        stroke="#F0CF86" stroke-width="16" stroke-linecap="butt" fill="none"/>

  <!-- Monogram T -->
  <path id="Letter-T" d="M263 210 H323 V226 H301 V314 H285 V226 H263 Z" fill="#F0CF86"/>

  <!-- Base ornament -->
  <path id="Base-Diamond" d="M256 346 L264 356 L256 366 L248 356 Z" fill="#C9973A"/>
</svg>
